[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sde"
version = "0.1.0"
description = "Spatial Data Explorer backend"
requires-python = ">=3.10"
dependencies = [
    "anndata",
    "scanpy",
    "fastapi",
    "uvicorn[standard]",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
sde = "sde.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
